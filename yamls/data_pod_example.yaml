# Persistent volume example: a DataNode, a DataPod and a PVC that uses them.
#
# Credentials for the backend. The keys are OpenDAL options of the backend.
# The secret must be in the namespace of the DataNode.
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: default
type: Opaque
stringData:
  access_key_id: "minioadmin"
  secret_access_key: "minioadmin"
---
# A DataNode points to a bucket (or a folder in it) in object storage.
apiVersion: kubedal.arunaengine.org/v1alpha1
kind: DataNode
metadata:
  name: example-s3-node
  namespace: default
  labels:
    region: us-east
spec:
  backend: S3 # S3 (and S3 compatible servers), GCS, Azblob or HTTP
  read_only: false
  limit: 10Gi # Largest amount of data one volume may copy to a node
  secretRef:
    name: s3-credentials
  # Any OpenDAL option of the backend. Secret values are merged in.
  config:
    bucket: my-bucket
    endpoint: http://minio-service.default.svc.cluster.local:9000
    region: us-east-1
---
# A DataPod is a folder inside a DataNode. The controller fills in a generated
# path if none is given.
apiVersion: kubedal.arunaengine.org/v1alpha1
kind: DataPod
metadata:
  name: example-data-pod
  namespace: default
spec:
  path: /data
  dataNodeRef:
    name: example-s3-node
  # Instead of a reference, a selector picks the first matching DataNode:
  #dataNodeSelector:
  #  region: us-east
---
# A PVC that uses the DataPod. The mount annotation is one of cache-read-only
# (default), cache-read-write, fuse-read-only or fuse-read-write.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: example-dataset-pvc
  namespace: default
  annotations:
    kubedal.arunaengine.org/data-pod-name: example-data-pod
    kubedal.arunaengine.org/mount: cache-read-only
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: kubedal
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: example-consumer
  namespace: default
spec:
  containers:
    - name: app
      image: alpine
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: dataset
          mountPath: /data
  volumes:
    - name: dataset
      persistentVolumeClaim:
        claimName: example-dataset-pvc
