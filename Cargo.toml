[package]
name = "kubedal"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
bytes = "1.10"
clap = "4.6"
futures = "0.3.31"
k8s-openapi = { version = "0.28.0", features = ["v1_32", "schemars"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "derive", "runtime"] }
opendal = { version = "0.59.4", features = [
    "services-s3",
    "services-http",
    "services-gcs",
    "services-azblob",
    "services-fs",
    "services-memory",
] }
fuse3 = { version = "0.9.0", features = ["unprivileged", "tokio-runtime"] }
libc = "0.2"
prost = "0.14.4"
prost-types = "0.14.4"
serde = "1.0.219"
serde_json = "1.0.140"
sharded-slab = "0.1.7"
tokio = { version = "1.53", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = { version = "0.14.6", features = ["server"] }
tonic-prost = "0.14.6"
uuid = { version = "1.16.0", features = ["v4"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
schemars = "1.2"
serde_yaml = "0.9.34"
thiserror = "2.0.12"
sha2 = "0.10"
rustix = { version = "1", features = ["fs"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[[bin]]
name = "kubedal"
path = "src/main.rs"

[[bin]]
name = "crdgen"
path = "src/crdgen.rs"

[dev-dependencies]
tempfile = "3.27.0"
