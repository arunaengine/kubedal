apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ .Values.driverName }}
  labels:
    {{- include "kubedal.labels" . | nindent 4 }}
spec:
  attachRequired: false
  # kubedal needs the pod name, namespace and service account to check access.
  podInfoOnMount: true
  volumeLifecycleModes:
    - Persistent
    - Ephemeral
  fsGroupPolicy: File
