name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      # S3 compatible server for tests/s3_minio.rs.
      s3:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: minioadmin
          RUSTFS_SECRET_KEY: minioadmin
        ports:
          - 9000:9000
      # Azure Blob Storage emulator for tests/gcs_azblob.rs.
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Create test bucket
        run: |
          for i in $(seq 1 30); do
            curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" --user minioadmin:minioadmin \
              -X PUT http://127.0.0.1:9000/kubedal-test && exit 0
            sleep 2
          done
          exit 1
      # A service cannot pass arguments to its image, and fake-gcs-server
      # needs them.
      - name: Start the GCS emulator and create the test bucket
        run: |
          docker run -d -p 4443:4443 fsouza/fake-gcs-server:1.56.1 \
            -scheme http -port 4443 -public-host 127.0.0.1:4443
          for i in $(seq 1 30); do
            curl -sf -X POST -H 'Content-Type: application/json' -d '{"name": "kubedal-test"}' \
              http://127.0.0.1:4443/storage/v1/b && exit 0
            sleep 2
          done
          exit 1
      - name: Create test container
        run: python3 test/azurite_container.py
      - run: cargo test --all-targets --locked
        env:
          KUBEDAL_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          KUBEDAL_TEST_GCS_ENDPOINT: http://127.0.0.1:4443
          KUBEDAL_TEST_AZBLOB_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/kubedal
      - run: helm template kubedal charts/kubedal --namespace kube-system > /dev/null

  image:
    # Each architecture builds on its own native runner: building arm64
    # under QEMU emulation takes more than an hour.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Nothing is pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: kubedal:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  e2e:
    runs-on: ubuntu-latest
    needs: [clippy, test]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kind
        run: |
          curl -sSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -sSL https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum \
            | sed 's/kind-linux-amd64/kind/' | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
      - name: Run end-to-end test
        run: ./test/e2e/run.sh
