name: Release

# A push to main whose Cargo.toml version has no tag yet makes a release:
# the image and the Helm chart go to ghcr.io, then the tag and the GitHub
# release are created.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          chart=$(sed -n 's/^version: //p' charts/kubedal/Chart.yaml)
          app=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' charts/kubedal/Chart.yaml)
          if [ "$version" != "$chart" ] || [ "$version" != "$app" ]; then
            echo "Cargo.toml ($version), chart version ($chart) and appVersion ($app) differ" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/arunaengine/kubedal:${{ env.VERSION }}
            ghcr.io/arunaengine/kubedal:latest
          labels: |
            org.opencontainers.image.source=https://github.com/arunaengine/kubedal
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-helm@v4
      - name: Push the Helm chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/kubedal --destination dist
          helm push "dist/kubedal-$VERSION.tgz" oci://ghcr.io/arunaengine/charts
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" "dist/kubedal-$VERSION.tgz" \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
