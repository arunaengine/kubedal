apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: e2e
type: Opaque
stringData:
  access_key_id: e2e-access
  secret_access_key: e2e-secret-key
---
apiVersion: kubedal.arunaengine.org/v1alpha1
kind: DataNode
metadata:
  name: store
  namespace: e2e
spec:
  backend: S3
  read_only: false
  limit: 1Gi
  secretRef:
    name: s3-credentials
  config:
    bucket: e2e
    endpoint: http://s3.e2e.svc:9000
    region: us-east-1
